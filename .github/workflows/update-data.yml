name: Update fear & greed data

on:
  schedule:
    # 23:00 UTC every Friday (after US market close).
    - cron: "0 23 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Fetch CNN data
        run: uv run python scripts/fetch_cnn.py

      - name: Rebuild combined CSV
        run: uv run python scripts/build_combined.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fear-greed.csv datasets/cnn_fear_greed.csv json/cnn_output.json
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
            exit 0
          fi
          git commit -m "data: refresh CNN fear & greed ($(date -u +%Y-%m-%d))"
          git push
