name: Update fear & greed data

on:
  schedule:
    # 23:00 UTC Monday-Friday (after US market close).
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write  # for the on-failure issue opener below

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CNN_FETCH_USER_AGENT: ${{ vars.CNN_FETCH_USER_AGENT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --no-default-groups

      - name: Fetch CNN data
        run: uv run --no-sync python scripts/fetch_cnn.py

      - name: Rebuild combined CSV
        run: uv run --no-sync python scripts/build_combined.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- fear-greed.csv datasets/cnn_fear_greed.csv; then
            echo "No CSV data changes; skipping commit."
            exit 0
          fi
          git add fear-greed.csv datasets/cnn_fear_greed.csv json/cnn_output.json
          git commit -m "data: refresh CNN fear & greed ($(date -u +%Y-%m-%d))"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `Data refresh failed (${today})`;
            // Dedupe: don't pile on if today's failure already opened one.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'refresh-failure',
              per_page: 5,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Issue already exists for today; skipping create.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `The scheduled refresh workflow failed on ${today}.`,
                ``,
                `**Run:** ${runUrl}`,
                ``,
                `Common causes:`,
                `- CNN changed bot detection (returns 418 / 403) — try rotating the User-Agent in \`scripts/fetch_cnn.py\` (override via \`CNN_FETCH_USER_AGENT\` env var).`,
                `- Endpoint shape change (\`fear_and_greed_historical.data\` missing).`,
                `- Staleness check fired (last date > 7 days old).`,
              ].join('\n'),
              labels: ['refresh-failure'],
            });
